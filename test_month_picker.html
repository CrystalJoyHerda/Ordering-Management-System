<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Month Picker Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .month-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #f9f5f1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d4c8b9;
        }
        .month-picker-input {
            padding: 6px 10px;
            border: 1px solid #d4c8b9;
            border-radius: 4px;
            font-size: 14px;
            color: #3b2a1f;
            background-color: white;
            cursor: pointer;
            min-width: 140px;
        }
        .apply-month-btn, .reset-month-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .apply-month-btn {
            background-color: #67503b;
            color: white;
        }
        .reset-month-btn {
            background-color: #6c757d;
            color: white;
        }
        #test-results {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Month Picker Test</h1>
    
    <div class="test-section">
        <h2>Month Filter Component</h2>
        <div class="month-filter">
            <label for="month-picker">Filter by Month:</label>
            <input type="month" id="month-picker" class="month-picker-input">
            <button class="apply-month-btn" id="apply-month-filter">Apply</button>
            <button class="reset-month-btn" id="reset-month-filter">Reset</button>
        </div>
    </div>

    <div class="test-section">
        <h2>API Test Results</h2>
        <button onclick="testCurrentMonth()">Test Current Month (June 2025)</button>
        <button onclick="testPreviousMonth()">Test Previous Month (May 2025)</button>
        <button onclick="testAllProducts()">Test All Products</button>
        <div id="test-results"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost/SOURCE_CODE/Employee/public/api';
        
        // Initialize month picker
        const monthPicker = document.getElementById('month-picker');
        const applyBtn = document.getElementById('apply-month-filter');
        const resetBtn = document.getElementById('reset-month-filter');
        const results = document.getElementById('test-results');
        
        // Set current month
        monthPicker.value = '2025-06';
        
        // Add event listeners
        applyBtn.addEventListener('click', function() {
            const selectedMonth = monthPicker.value;
            if (selectedMonth) {
                testMonthFilter(selectedMonth);
            }
        });
        
        resetBtn.addEventListener('click', function() {
            monthPicker.value = '';
            results.textContent = 'Month filter reset. Click "Test All Products" to see results.';
        });
        
        async function testMonthFilter(monthYear) {
            try {
                const [year, month] = monthYear.split('-');
                const startDate = `${year}-${month}-01`;
                const endDate = new Date(year, month, 0).toISOString().slice(0, 10);
                
                results.textContent = `Testing month filter for ${monthYear}...\nDate range: ${startDate} to ${endDate}\n\n`;
                
                const response = await fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=5&start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();
                
                results.textContent += `API Response:\n${JSON.stringify(data, null, 2)}`;
                
            } catch (error) {
                results.textContent += `Error: ${error.message}`;
            }
        }
        
        async function testCurrentMonth() {
            monthPicker.value = '2025-06';
            testMonthFilter('2025-06');
        }
        
        async function testPreviousMonth() {
            monthPicker.value = '2025-05';
            testMonthFilter('2025-05');
        }
        
        async function testAllProducts() {
            try {
                results.textContent = 'Testing all products (no date filter)...\n\n';
                
                const response = await fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=5`);
                const data = await response.json();
                
                results.textContent += `API Response:\n${JSON.stringify(data, null, 2)}`;
                
            } catch (error) {
                results.textContent += `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
