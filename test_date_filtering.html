<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Filtering Test</title>
</head>
<body>
    <h1>Date Filtering Implementation Test</h1>
    <div id="results"></div>

    <script>
        async function testDateFiltering() {
            const resultsDiv = document.getElementById('results');
            const testDate = '2025-05-27';
            
            resultsDiv.innerHTML = '<h2>Testing Date Filtering...</h2>';
            
            try {
                // Test 1: Sales Overview with date
                resultsDiv.innerHTML += '<h3>1. Testing Sales Overview API with date parameter</h3>';
                const salesResponse = await fetch(`http://localhost/SOURCE_CODE/Employee/public/api/sales.php?action=overview&status=completed&date=${testDate}`);
                const salesData = await salesResponse.json();
                resultsDiv.innerHTML += `<p>Sales API Response: ${salesData.status === 'success' ? '✅ SUCCESS' : '❌ FAILED'}</p>`;
                if (salesData.data) {
                    resultsDiv.innerHTML += `<p>Today's sales for ${testDate}: ₱${salesData.data.today.total.toFixed(2)}</p>`;
                }
                
                // Test 2: Top Products with date
                resultsDiv.innerHTML += '<h3>2. Testing Top Products API with date parameter</h3>';
                const topProductsResponse = await fetch(`http://localhost/SOURCE_CODE/Employee/public/api/sales.php?action=top_products&limit=5&status=completed&date=${testDate}`);
                const topProductsData = await topProductsResponse.json();
                resultsDiv.innerHTML += `<p>Top Products API Response: ${topProductsData.status === 'success' ? '✅ SUCCESS' : '❌ FAILED'}</p>`;
                if (topProductsData.data) {
                    resultsDiv.innerHTML += `<p>Found ${topProductsData.data.length} products for ${testDate}</p>`;
                }
                
                // Test 3: Orders with date
                resultsDiv.innerHTML += '<h3>3. Testing Orders API with date parameter</h3>';
                const ordersResponse = await fetch(`http://localhost/SOURCE_CODE/Employee/public/api/orders.php?limit=10&date=${testDate}`);
                const ordersData = await ordersResponse.json();
                resultsDiv.innerHTML += `<p>Orders API Response: ${ordersData.status === 'success' ? '✅ SUCCESS' : '❌ FAILED'}</p>`;
                if (ordersData.data) {
                    resultsDiv.innerHTML += `<p>Found ${ordersData.data.length} orders for ${testDate}</p>`;
                }
                
                resultsDiv.innerHTML += '<h3>🎉 Test completed!</h3>';
                resultsDiv.innerHTML += '<p>If all APIs respond with ✅ SUCCESS, the date filtering is working properly.</p>';
                
            } catch (error) {
                resultsDiv.innerHTML += `<p>❌ Error during testing: ${error.message}</p>`;
                console.error('Test error:', error);
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testDateFiltering);
    </script>
</body>
</html>
