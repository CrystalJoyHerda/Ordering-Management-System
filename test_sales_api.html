<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 8px 16px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Sales API Connection Test</h1>
    
    <div class="test-section">
        <h3>Test Sales Overview</h3>
        <button onclick="testSalesOverview()">Test Overview</button>
        <div id="overview-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test Sales Trends</h3>
        <button onclick="testSalesTrends('daily')">Test Daily</button>
        <button onclick="testSalesTrends('weekly')">Test Weekly</button>
        <button onclick="testSalesTrends('monthly')">Test Monthly</button>
        <div id="trends-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test Top Products</h3>
        <button onclick="testTopProducts()">Test Top Products</button>
        <div id="products-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test Date Range</h3>
        <button onclick="testDateRange()">Test Date Range</button>
        <div id="daterange-result" class="result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost/SOURCE_CODE/Employee/public/api';        async function testSalesOverview() {
            const resultDiv = document.getElementById('overview-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=overview`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${data.status === 'success' ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>API Status:</strong> ${data.status}<br>
                        ${data.status === 'success' ? `
                            <strong>Today's Sales:</strong> ₱${Number(data.data.today.total || 0).toLocaleString()} (${data.data.today.change || 0}%)<br>
                            <strong>Weekly Sales:</strong> ₱${Number(data.data.weekly.total || 0).toLocaleString()} (${data.data.weekly.change || 0}%)<br>
                            <strong>Monthly Sales:</strong> ₱${Number(data.data.monthly.total || 0).toLocaleString()} (${data.data.monthly.change || 0}%)<br>
                        ` : `<strong>Error:</strong> ${data.message || 'Unknown error'}`}
                        <details>
                            <summary>Raw Response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Connection Error: ${error.message}</div>`;
            }
        }        async function testSalesTrends(timeframe) {
            const resultDiv = document.getElementById('trends-result');
            resultDiv.innerHTML = `Testing ${timeframe} trends...`;
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=trends&timeframe=${timeframe}`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${data.status === 'success' ? 'success' : 'error'}">
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>API Status:</strong> ${data.status}<br>
                        <strong>Timeframe:</strong> ${timeframe}<br>
                        ${data.status === 'success' && data.data ? `
                            <strong>Data Points:</strong> ${Array.isArray(data.data) ? data.data.length : 'Invalid format'}<br>
                            ${Array.isArray(data.data) && data.data.length > 0 ? `
                                <strong>Sample Data:</strong><br>
                                • ${data.data[0].label || 'No label'}: ₱${Number(data.data[0].total || 0).toLocaleString()}<br>
                                ${data.data[1] ? `• ${data.data[1].label || 'No label'}: ₱${Number(data.data[1].total || 0).toLocaleString()}<br>` : ''}
                            ` : ''}
                        ` : `<strong>Error:</strong> ${data.message || 'Unknown error'}`}
                        <details>
                            <summary>Raw Response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Connection Error: ${error.message}</div>`;
            }
        }

        async function testTopProducts() {
            const resultDiv = document.getElementById('products-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=5`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${data.status === 'success' ? 'success' : 'error'}">
                        Status: ${response.status}<br>
                        Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function testDateRange() {
            const resultDiv = document.getElementById('daterange-result');
            resultDiv.innerHTML = 'Testing...';
            
            const endDate = new Date().toISOString().split('T')[0];
            const startDate = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=date_range&start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="${data.status === 'success' ? 'success' : 'error'}">
                        Status: ${response.status}<br>
                        Date Range: ${startDate} to ${endDate}<br>
                        Response: <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // Test connection on load
        window.onload = function() {
            console.log('Testing sales API connection...');
            testSalesOverview();
        };
    </script>
</body>
</html>
