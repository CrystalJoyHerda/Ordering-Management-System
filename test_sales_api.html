<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Sales API Connection Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Sales Overview API</h3>
        <button onclick="testOverview()">Test Overview API</button>
        <div id="overview-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Top Products API</h3>
        <button onclick="testTopProducts()">Test Top Products API</button>
        <div id="products-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Combined Test (Sales History Page Logic)</h3>
        <button onclick="testCombined()">Test Combined Logic</button>
        <div id="combined-result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost/SOURCE_CODE/Employee/public/api';

        async function testOverview() {
            const resultDiv = document.getElementById('overview-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=overview`);
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h4>✅ Success!</h4>
                        <p>Today's Sales: ₱${data.data.today_sales || 0}</p>
                        <p>Today's Orders: ${data.data.today_orders || 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(`API Error: ${data.message || 'Unknown error'}`);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h4>❌ Error!</h4>
                    <p>${error.message}</p>
                `;
            }
        }

        async function testTopProducts() {
            const resultDiv = document.getElementById('products-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=10`);
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h4>✅ Success!</h4>
                        <p>Found ${data.data.length} products</p>
                        ${data.data.length > 0 ? `
                            <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                                <thead>
                                    <tr style="background: #f8f9fa;">
                                        <th style="border: 1px solid #ddd; padding: 8px;">Product</th>
                                        <th style="border: 1px solid #ddd; padding: 8px;">Quantity</th>
                                        <th style="border: 1px solid #ddd; padding: 8px;">Revenue</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.data.slice(0, 5).map(product => `
                                        <tr>
                                            <td style="border: 1px solid #ddd; padding: 8px;">${product.product_name}</td>
                                            <td style="border: 1px solid #ddd; padding: 8px;">${product.total_quantity}</td>
                                            <td style="border: 1px solid #ddd; padding: 8px;">₱${product.total_revenue}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<p>No products found for today</p>'}
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(`API Error: ${data.message || 'Unknown error'}`);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h4>❌ Error!</h4>
                    <p>${error.message}</p>
                `;
            }
        }

        async function testCombined() {
            const resultDiv = document.getElementById('combined-result');
            resultDiv.innerHTML = '<p>Testing combined logic...</p>';
            
            try {
                // Test both APIs like the sales history page does
                const [overviewResponse, productsResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/sales.php?action=overview`),
                    fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=20`)
                ]);
                
                const overviewData = await overviewResponse.json();
                const productsData = await productsResponse.json();
                
                if (overviewData.status === 'success' && productsData.status === 'success') {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h4>✅ Combined Test Success!</h4>
                        <p><strong>Total Sales Today:</strong> ₱${overviewData.data.today_sales || 0}</p>
                        <p><strong>Products Found:</strong> ${productsData.data.length}</p>
                        <p><strong>Status:</strong> Ready for Sales History Page</p>
                        <details>
                            <summary>Full API Response</summary>
                            <h5>Overview Data:</h5>
                            <pre>${JSON.stringify(overviewData, null, 2)}</pre>
                            <h5>Products Data:</h5>
                            <pre>${JSON.stringify(productsData, null, 2)}</pre>
                        </details>
                    `;
                } else {
                    throw new Error(`API Error: ${overviewData.message || productsData.message || 'Unknown error'}`);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h4>❌ Combined Test Failed!</h4>
                    <p>${error.message}</p>
                    <p><strong>Check:</strong></p>
                    <ul>
                        <li>XAMPP is running</li>
                        <li>MySQL service is started</li>
                        <li>Database 'employee_db' exists</li>
                        <li>API files are in htdocs/SOURCE_CODE/Employee/</li>
                    </ul>
                `;
            }
        }
    </script>
</body>
</html>
