<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auto-Login After Password Reset</title>
    <link rel="stylesheet" href="SOURCE CODE/SystemDesign/css/loginInterface.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="RESOURCES/logo.png" alt="Coffee Shop Logo" class="logo">
            <h1>Order Management System</h1>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="4" required>
            </div>
            
            <button type="submit" id="login-button" class="login-btn">Login</button>
            
            <!-- Error/Success message container -->
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <div class="forgot-password-container">
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>
        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Forgot Password</h2>
                <span class="close">&times;</span>
            </div>
            <form id="resetForm" class="modal-form">
                <div class="form-group">
                    <label for="resetEmail">Enter your email address:</label>
                    <input type="email" id="resetEmail" name="resetEmail" required>
                    <small>We'll verify your email and allow you to reset your password.</small>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Verify</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New Password Modal -->
    <div id="newPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Set New Password</h2>
                <span class="close">&times;</span>
            </div>
            <form id="newPasswordForm" class="modal-form">
                <input type="hidden" id="resetUserEmail" name="resetUserEmail">
                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" minlength="4" required>
                    <small>Password must be at least 4 characters long.</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="4" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn">Cancel</button>
                    <button type="submit" class="submit-btn">Reset Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="SOURCE CODE/SystemDesign/js/auth.js"></script>
    <script src="SOURCE CODE/SystemDesign/js/loginInterface.js"></script>
    <script src="SOURCE CODE/SystemDesign/js/forgot-password.js"></script>
    
    <script>
        // Test script to verify auto-login functionality
        console.log('Test page loaded for auto-login after password reset');
        
        // Add event listener to track login success
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            
            // Override the showSuccess function to add more detailed logging
            if (window.showSuccess) {
                const originalShowSuccess = window.showSuccess;
                window.showSuccess = function(message) {
                    console.log('SUCCESS: Auto-login triggered with message:', message);
                    originalShowSuccess(message);
                };
            }
            
            // Listen for login form submissions
            loginForm.addEventListener('submit', function(e) {
                console.log('Login form submitted');
                console.log('Username:', document.getElementById('username').value);
                console.log('Password length:', document.getElementById('password').value.length);
            });
            
            // Test instructions
            console.log(`
=== TEST INSTRUCTIONS ===
1. Click "Forgot Password?" link
2. Enter email: cashier2@example.com
3. Verify email (should find user "jesse")
4. Set new password (minimum 4 characters)
5. System should automatically:
   - Close the modal
   - Fill in username field with "jesse"
   - Fill in password field with new password
   - Submit the login form
   - Show "Login successful! Redirecting..." message
   - Redirect to appropriate dashboard
            `);
        });
    </script>
</body>
</html>
