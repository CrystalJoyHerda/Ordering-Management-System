<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Timezone Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>Timezone Fix Test - Sales API</h1>
    <p><strong>Expected today's date:</strong> Tuesday, May 27, 2025</p>
    
    <button onclick="testCurrentDate()">Test Current Date from API</button>
    <button onclick="testSalesOverview()">Test Sales Overview</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        const API_BASE_URL = 'http://localhost/SOURCE_CODE/Employee/public/api';
          async function testCurrentDate() {
            addResult('Testing current date from server...', 'info');
            
            try {
                // Use the new debug_timezone endpoint
                const response = await fetch(`${API_BASE_URL}/sales.php?action=debug_timezone`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    addResult(`✅ Server timezone: ${data.timezone}`, 'success');
                    addResult(`✅ Server current date: ${data.current_date} (${data.formatted_date})`, 'success');
                    addResult(`✅ Server datetime: ${data.current_datetime}`, 'success');
                    addResult(`ℹ️ UTC datetime: ${data.utc_datetime}`, 'info');
                } else {
                    addResult(`API Error: ${data.message}`, 'error');
                }
                
                // Also show JavaScript client date for comparison
                const clientDate = new Date();
                addResult(`🖥️ Client date: ${clientDate.toLocaleDateString('en-US', { 
                    weekday: 'long', 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                })}`, 'info');
                
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, 'error');
            }
        }
          async function testSalesOverview() {
            addResult('Testing sales overview with today\'s sales...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/sales.php?action=overview`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const todayTotal = Number(data.data.today.total || 0);
                    const weeklyTotal = Number(data.data.weekly.total || 0);
                    const monthlyTotal = Number(data.data.monthly.total || 0);
                    
                    addResult(`📊 Today's sales: ₱${todayTotal.toLocaleString()} (Change: ${data.data.today.change}%)`, 
                             todayTotal > 0 ? 'success' : 'info');
                    addResult(`📈 Weekly sales: ₱${weeklyTotal.toLocaleString()} (Change: ${data.data.weekly.change}%)`, 'success');
                    addResult(`📅 Monthly sales: ₱${monthlyTotal.toLocaleString()} (Change: ${data.data.monthly.change}%)`, 'success');
                    
                    if (todayTotal === 0) {
                        addResult('⚠️ Today\'s sales is ₱0. This may indicate the timezone issue if orders exist for today.', 'error');
                    } else {
                        addResult('✅ Today\'s sales shows a value > 0, indicating the timezone fix may be working!', 'success');
                    }
                } else {
                    addResult(`❌ API Error: ${data.message}`, 'error');
                }
                
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function addResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto-test on page load
        window.onload = function() {
            addResult('Page loaded. Ready to test timezone fix.', 'info');
        };
    </script>
</body>
</html>
