<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // Test basic connection
                resultsDiv.innerHTML += '<h3>Testing API Connection...</h3>';
                
                const response = await fetch('http://localhost/SOURCE_CODE/Employee/public/api/orders.php');
                resultsDiv.innerHTML += `<p>API Response Status: ${response.status}</p>`;
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML += '<p>✅ API is accessible</p>';
                    resultsDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    resultsDiv.innerHTML += '<p>❌ API returned error status</p>';
                }
                
                // Test order lookup (if there are orders in database)
                resultsDiv.innerHTML += '<h3>Testing Order Lookup...</h3>';
                const lookupResponse = await fetch('http://localhost/SOURCE_CODE/Employee/public/api/orders.php?order_number=001');
                
                if (lookupResponse.ok) {
                    const lookupData = await lookupResponse.json();
                    resultsDiv.innerHTML += '<p>Order lookup response:</p>';
                    resultsDiv.innerHTML += `<pre>${JSON.stringify(lookupData, null, 2)}</pre>`;
                } else {
                    resultsDiv.innerHTML += '<p>Order lookup failed or no order with number 001</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML += `<p>❌ Error: ${error.message}</p>`;
                resultsDiv.innerHTML += '<p>Make sure XAMPP is running and the project is in the correct folder</p>';
            }
        }
        
        // Run test when page loads
        window.onload = testAPI;
    </script>
</body>
</html>
