<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier - Stocks</title>
    <link rel="stylesheet" href="stockscashier.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <img src="../../RESOURCES/logo.png" alt="Coffee Logo">
                </div>
                <div class="cashier-text">CASHIER</div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="cashierdashboard.html">Dashboard</a></li>
                    <li><a href="cashiering.html">Cashiering</a></li>
                    <li class="active"><a href="stockscashier.html">Stocks</a></li>
                    <li><a href="saleshistoryinter.html">Sales History</a></li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Stocks</h1>
            </div>
            
            <div class="controls">
                <div class="search-container">
                    <input type="text" placeholder="Search:" class="search-input">
                </div>
            </div>
            
            <div class="table-container">
                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th>PRODUCT</th>
                            <th>STATUS</th>
                            <th>REMAINING</th>
                            <th>ALERT</th>
                        </tr>
                    </thead>
                    <tbody id="stocksTableBody">
                        <!-- Table will be populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function handleLogout() {
            if(confirm('Are you sure you want to logout?')) {
                window.location.href = 'login.html';
            }
        }

        // Sample data - This would actually come from your database/admin updates
        const stocksData = [
            {
                product: "Espresso",
                remaining: 15,
                threshold: 5,
                unit: "servings"
            },
            {
                product: "Cappuccino",
                remaining: 3,
                threshold: 5,
                unit: "servings"
            },
            {
                product: "Croissant",
                remaining: 2,
                threshold: 4,
                unit: "pieces"
            }
        ];

        function updateStocksDisplay() {
            const tbody = document.getElementById('stocksTableBody');
            tbody.innerHTML = '';

            stocksData.forEach(item => {
                const status = item.remaining <= item.threshold ? 'low' : 'good';
                const alert = status === 'low' ? 'Restock Needed' : 'Stock Level OK';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.product}</td>
                    <td><span class="status ${status}">${status === 'low' ? 'Low Stock' : 'Good Stock'}</span></td>
                    <td>${item.remaining} ${item.unit}</td>
                    <td>${alert}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initial display
        updateStocksDisplay();

        // Update stocks every minute (simulating real-time updates)
        setInterval(updateStocksDisplay, 60000);
    </script>
</body>
</html>
