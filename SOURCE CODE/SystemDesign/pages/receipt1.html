<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipt</title>

    <link rel="stylesheet" href="../css/receiptinter.css" />
    <script src="../js/receiptinter.js" defer></script>

    <link rel="stylesheet" href="receiptinter.css" />
    <script src="receiptinter.js" defer></script>
    <style>
        .print-button-container {
            text-align: center;
            margin-top: 20px;
        }

        #printBtn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>

</head>
<body>
    <div class="receipt-container">        <div class="receipt">
            <div class="header-center">
                <img src="../assets/images/logo.png" alt="Logo" class="logo" />
                <h1>BYTE & BEANS BY JJOC</h1>
                <p class="slogan">"Byte into Flavor, Brewed to Perfection!"</p>
                <div class="receipt-info">
                    <p id="receipt-datetime"></p>
                    <p>Queue Number: <span class="queue-number">0000</span></p>
                    <p>Order Type: <span id="order-type">---</span></p>
                    <p>Cashier: <span id="cashier-name">---</span></p>
                </div>
            </div>

            <div class="order-items" id="orderItemsList">
                <!-- Items will be populated dynamically with full details -->
            </div>

            <div class="totals">
                <div class="total-line">
                    <span>Total Amount:</span>
                    <span class="amount">₱0.00</span>
                </div>
                <div class="total-line">
                    <span>Cash:</span>
                    <span class="amount">₱0.00</span>
                </div>
                <div class="total-line">
                    <span>Change:</span>
                    <span class="amount">₱0.00</span>
                </div>
            </div>
        </div>

        <div class="paper-break"></div>        <div class="queue-slip">
            <div class="header-center">
                <img src="../assets/images/logo.png" alt="Logo" class="logo" />
                <h1>BYTE & BEANS BY JJOC</h1>
            </div>
            <div class="queue-content">
                <h2>Queue Number</h2>
                <div class="number">0000</div>
                <div id="queue-datetime" class="datetime"></div>
            </div>
        </div>
    </div>

    <div class="print-button-container">
        <button id="printBtn">Print Receipt</button>
    </div>    <script>        // Store receiptData globally within this script
        let receiptData = null;
        
        // Function to display order items in receipt
        function displayItems(data) {
            const container = document.getElementById('orderItemsList');
            if (!container || !data || !data.items) return;
            
            container.innerHTML = '';
            
            data.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item';
                
                // Format the main item line with quantity and name
                const mainLine = `<span class="item-main">${item.name} x${item.quantity}</span>`;
                
                // Format add-ons with smaller font if they exist
                const addonsLine = item.addons && item.addons.length > 0 
                    ? `<span class="addon-text">+ ${Array.isArray(item.addons) ? item.addons.join(', ') : item.addons}</span>` 
                    : '';
                
                // Format price
                const priceLine = `<span class="price">₱${item.totalPrice.toFixed(2)}</span>`;
                
                row.innerHTML = `
                    <div class="item-content">
                        <div class="item-details">
                            ${mainLine}
                            ${addonsLine}
                        </div>
                        ${priceLine}
                    </div>
                `;
                
                container.appendChild(row);
            });
        }
        
        // Function to display payment details
        function displayPaymentDetails(data) {
            if (!data) return;
            
            const totals = document.querySelectorAll('.total-line .amount');
            if (totals.length >= 3) {
                totals[0].textContent = formatPrice(data.total);
                totals[1].textContent = formatPrice(data.cash);
                totals[2].textContent = formatPrice(data.change);
            }
        }
        
        // Helper function to format price
        function formatPrice(value) {
            if (typeof value === 'string') {
                if (value.startsWith('₱')) {
                    value = value.substring(1);
                }
                value = parseFloat(value);
            }
            return isNaN(value) ? '₱0.00' : `₱${value.toFixed(2)}`;
        }
          // Function to update order status
        async function updateOrderStatus(orderId, status) {
            try {
                console.log(`🔄 Starting order status update...`);
                console.log(`📋 Order ID: ${orderId} (type: ${typeof orderId})`);
                console.log(`📋 New Status: ${status}`);
                
                // Ensure orderId is a number
                const numericOrderId = parseInt(orderId);
                if (isNaN(numericOrderId)) {
                    throw new Error(`Invalid order ID: ${orderId}`);
                }
                
                const requestBody = {
                    id: numericOrderId,
                    status: status
                };
                  console.log('📤 Request body:', JSON.stringify(requestBody));
                console.log('🌐 Making API call to update order status...');
                  const response = await fetch('http://localhost:3000/SOURCE%20CODE/Employee/public/api/orders.php', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const responseText = await response.text();
                console.log('📥 Raw response text:', responseText);
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('❌ Failed to parse JSON response:', parseError);
                    throw new Error(`Invalid JSON response: ${responseText}`);
                }
                
                console.log('📥 Parsed response result:', result);
                
                if (result.status === 'success') {
                    console.log(`✅ Order ${numericOrderId} status successfully updated to ${status}`);
                    return true;
                } else {
                    console.error('❌ Order status update failed:', result.message);
                    return false;
                }
            } catch (error) {
                console.error('🚨 Error updating order status:', error);
                console.error('🚨 Error stack:', error.stack);
                return false;
            }
        }window.onload = function() {
            console.log('🎫 Receipt page loading...');
            console.log('📋 Checking localStorage for receiptData...');
            
            receiptData = JSON.parse(localStorage.getItem('receiptData'));
            console.log('📥 Raw receiptData from localStorage:', receiptData);
            
            if (!receiptData) {
                console.error('❌ No receipt data found in localStorage');
                alert('No receipt data found');
                window.location.href = 'cashiering.html';
                return;
            }

            // Log order ID specifically
            if (receiptData.orderId) {
                console.log('✅ Order ID found in receipt data:', receiptData.orderId, '(type:', typeof receiptData.orderId, ')');
            } else {
                console.warn('⚠️ No orderId found in receipt data');
                console.log('Available keys in receiptData:', Object.keys(receiptData));
            }

            // Update queue numbers in all locations
            const queueNumber = receiptData.queueNumber || '0000';
            document.querySelector('.queue-number').textContent = queueNumber;
            document.querySelector('.queue-slip .number').textContent = queueNumber;
            const queueText = document.querySelector('.receipt-info p:nth-child(2)');
            queueText.textContent = `Queue Number: ${queueNumber}`;

            // Update order type display
            const orderType = receiptData.orderType || 'Dine In';
            document.getElementById('order-type').textContent = orderType;

            // Update cashier name
            const cashierName = receiptData.cashierName || 'Ogille Dane Provido';
            document.getElementById('cashier-name').textContent = cashierName;

            // Display receipt items and payment details
            displayItems(receiptData);
            displayPaymentDetails(receiptData);
            
            console.log('🎫 Receipt page loaded successfully');
        };

        document.getElementById('printBtn').addEventListener('click', async function() {
            const btn = this;
            btn.textContent = 'Printing...';
            btn.disabled = true;
              // If order has an ID, update its status to 'completed'
            if (receiptData && receiptData.orderId) {
                console.log('🔄 Updating order status to completed for order ID:', receiptData.orderId);
                
                try {
                    const success = await updateOrderStatus(receiptData.orderId, 'completed');
                    
                    if (success) {
                        console.log('✅ Order status successfully updated to completed in database');
                        btn.textContent = 'Status Updated - Redirecting...';
                    } else {
                        console.error('❌ Failed to update order status in database');
                        btn.textContent = 'Update Failed - Redirecting...';
                    }
                    
                    // Wait a bit longer to ensure the status update completes
                    setTimeout(() => {
                        window.location.href = 'cashiering.html';
                    }, 2000);
                    
                } catch (error) {
                    console.error('🚨 Error during status update:', error);
                    btn.textContent = 'Error - Redirecting...';
                    
                    setTimeout(() => {
                        window.location.href = 'cashiering.html';
                    }, 2000);
                }
                
            } else {
                console.warn('⚠️ Order ID not found in receipt data, cannot update status');
                console.log('Receipt data:', JSON.stringify(receiptData));
                
                setTimeout(() => {
                    window.location.href = 'cashiering.html';
                }, 1000);
            }
        });
    </script>
</body>
</html>
