<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        .debug-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .error { color: red; }
        .success { color: green; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>API Test</h1>
    <div id="result"></div>
    <script>
        // API endpoints - using direct PHP server path
        const API_BASE = 'http://localhost:8000';
        
        // Function to test the products API
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            try {
                // Show debugging info
                const token = localStorage.getItem('auth_token');
                resultDiv.innerHTML = `
                    <div class="debug-info">
                        <p>Testing API connection...</p>
                        <p>Current URL: ${window.location.href}</p>
                        <p>API URL: ${API_BASE}/api/products.php</p>
                        <p>Token available: ${token ? 'Yes' : 'No'}</p>
                    </div>
                `;

                console.log('Attempting fetch to:', `${API_BASE}/api/products.php`);
                
                // Test the connection
                const response = await fetch(`${API_BASE}/api/products.php`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : '',
                        'Origin': 'http://127.0.0.1:5501'
                    },
                    credentials: 'include',
                    mode: 'cors'
                });

                console.log('Response received:', response.status, response.statusText);

                // Get the raw response text for debugging
                const responseText = await response.text();
                console.log('Raw response:', responseText);

                // Try to parse the response as JSON
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error(`Invalid JSON response: ${responseText.substring(0, 100)}...`);
                }
                
                if (data.status === 'success') {
                    resultDiv.innerHTML += `
                        <p class="success">API connection successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(data.message || 'Unknown error');
                }
            } catch (error) {
                console.error('Detailed error:', error);
                resultDiv.innerHTML += `
                    <div class="error">
                        <p>API Error: ${error.message}</p>
                        <p>Please check:</p>
                        <ul>
                            <li>Is PHP server running on port 8000? Command: php -S localhost:8000</li>
                            <li>Check the Network tab in browser dev tools for the exact error</li>
                            <li>Try accessing the API directly in browser: ${API_BASE}/api/products.php</li>
                            <li>Check console for detailed error messages</li>
                        </ul>
                    </div>
                `;
            }
        }

        // Add login test function
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            try {
                console.log('Starting login test...');
                resultDiv.innerHTML = '<div class="debug-info">Testing login...</div>';
                
                const response = await fetch(`${API_BASE}/api/auth.php`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Origin': 'http://127.0.0.1:5501'
                    },
                    body: JSON.stringify({
                        username: 'Crystal',
                        password: 'admin123'
                    }),
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const responseText = await response.text();
                console.log('Raw login response:', responseText);
                
                const data = JSON.parse(responseText);
                
                if (data.token) {
                    localStorage.setItem('auth_token', data.token);
                    resultDiv.innerHTML = `
                        <p class="success">Login successful!</p>
                        <button onclick="testAPI()">Test Products API</button>
                    `;
                } else {
                    throw new Error(data.message || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `<p class="error">Login Error: ${error.message}</p>`;
            }
        }

        // Add buttons for testing
        document.body.insertAdjacentHTML('afterbegin', `
            <div style="margin-bottom: 20px;">
                <button onclick="testLogin()">Test Login</button>
                <button onclick="testAPI()">Test Products API</button>
                <button onclick="window.open('${API_BASE}/api/products.php', '_blank')">Open API Directly</button>
            </div>
        `);

        // Initial test
        testAPI();
    </script>
</body>
</html>
