<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="../css/orderconfirm.css">
    <script src="../js/orderconfirm.js" defer></script>
</head>
<body>
    <div class="container">        <div class="header">
            <div class="logo">
                <img src="../assets/images/logo.png" alt="Logo">
            </div>
            <div class="header-center">
                <div class="datetime">Tuesday, February 25, 2025 4:33pm</div>
                <div class="queue-input">
                    <label>Queue Number :</label>
                    <input type="text" readonly>
                </div>
            </div>
            <button class="employee-btn" onclick="window.location.href='employee.html'">Employee</button>
        </div>

        <div class="content">
            <div class="order-section">
                <h2>ORDER</h2>
                <div class="grid-container">
                    <div class="grid-header">
                        <div>Quantity</div>
                        <div>Product Name</div>
                        <div>Price</div>
                    </div>
                    <div class="grid-content">
                        <!-- Order items will be populated here -->
                    </div>
                </div>
            </div>

            <div class="payment-section">
                <h2>PAYMENT</h2>
                <div class="payment-info">
                    <div class="payment-row total">
                        <span>Total Amount:</span>
                        <span id="totalAmount">₱0.00</span>
                    </div>
                    <div class="payment-row">
                        <span>Cash:</span>
                        <input type="number" id="cashInput" placeholder="₱0.00">
                    </div>
                    <div class="payment-row">
                        <span>Change:</span>
                        <span id="changeAmount">₱0.00</span>
                    </div>
                </div>
                <button class="print-btn" onclick="handlePrint()">Print Receipt</button>
            </div>
        </div>
    </div>
</body>
</html>
