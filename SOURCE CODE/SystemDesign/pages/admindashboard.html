<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop Admin Dashboard</title>
    <link rel="stylesheet" href="../css/admindashboard1.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">
    <!-- Auth check script -->
    <script src="../js/auth-check.js"></script>
    <!-- RBAC service -->
    <script src="../js/rbac.js"></script>
    <!-- Logout helper -->
    <script src="../js/logout-helper.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">            <div class="logo-section">
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="Coffee Logo">
                </div>
                <div class="admin-text">ADMIN</div>
            </div>              <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="adminDashboard.html">Dashboard</a></li>
                    <li><a href="manageEmployee.html" data-role-access="admin">Manage Employees</a></li>
                    <li><a href="stocks.html">Stocks</a></li>
                    <li><a href="#" data-role-access="admin">Sales</a></li>
                    <li><a href="inventory.html" data-role-access="admin">Inventory</a></li>
                </ul>
            </nav>
              <div class="logout-section">
                <button class="logout-btn">Log Out</button>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <div class="header">
                <h1>Dashboard</h1>
                <div class="user-info">
                    Welcome, <span id="admin-name">Admin</span>
                </div>
            </div>            <div class="content-area">
                <!-- Dashboard content would go here -->
                <div class="dashboard-widgets">
                    <div class="widget">
                        <h3>Quick Actions</h3>
                        <div class="quick-links">
                            <a href="inventory.html" class="quick-link-card" data-role-access="admin">
                                <div class="quick-link-icon">📦</div>
                                <div class="quick-link-text">
                                    <h4>Inventory Management</h4>
                                    <p>Add, edit, or delete products</p>
                                </div>
                            </a>
                            <a href="manageEmployee.html" class="quick-link-card" data-role-access="admin">
                                <div class="quick-link-icon">👥</div>
                                <div class="quick-link-text">
                                    <h4>Employee Management</h4>
                                    <p>Manage employee details</p>
                                </div>
                            </a>
                            <a href="stocks.html" class="quick-link-card">
                                <div class="quick-link-icon">🧮</div>
                                <div class="quick-link-text">
                                    <h4>Stock Management</h4>
                                    <p>Check and update product stock</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/rbac.js"></script>
    <script src="../js/logout-helper.js"></script>
    <script src="../js/adminDashboard.js"></script>
</body>
</html>
