<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History</title>
    <link rel="stylesheet" href="../css/saleshistoryinter.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">            <div class="logo-section">
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="Coffee Logo">
                </div>
                <div class="cashier-text">CASHIER</div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="cashierdashboard.html">Dashboard</a></li>
                    <li><a href="cashiering.html">Cashiering</a></li>
                    <li><a href="stockscashier.html">Stocks</a></li>
                    <li class="active"><a href="saleshistorycashier.html">Sales History</a></li>
                </ul>
            </nav>
              <div class="logout-section">
                <button class="logout-btn" id="logout-button">Log Out</button>
            </div>
        </div>        <!-- Main Content -->
        <div class="main-content">            <div class="header">
                <h1>Sales History</h1>
                <div class="shift-info">
                    <span id="totalSales">Total: ₱0.00</span>
                    <div style="display: flex; align-items: center; gap: 10px; margin-left: 20px;">
                        <label for="datePicker" style="color: white; font-size: 14px;">Date:</label>
                        <input type="date" id="datePicker" style="background: white; color: #67503b; border: 1px solid white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px;">
                        <button id="refreshBtn" style="background: white; color: #67503b; border: 1px solid white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px;">🔄 Refresh</button>
                    </div>
                </div>
            </div>

            <div class="content-grid">
                <!-- Left box with charts -->
                <div class="chart-box">
                    <h2>SALES</h2>
                    <div class="chart-container">
                        <!-- Donut Chart -->
                        <div class="donut-chart">
                            <!-- Chart will be added here -->
                        </div>
                        <!-- Bar Graph -->
                        <div class="bar-graph">
                            <!-- Graph will be added here -->
                        </div>
                    </div>
                </div>                <!-- Right box with table -->
                <div class="table-box">
                    <h2>Today's Sales</h2>
                    <div class="table-container">
                        <table class="sales-table">
                            <thead>
                                <tr>
                                    <th>PRODUCT</th>
                                    <th>QUANTITY</th>
                                    <th>TOTAL</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Table data will be populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>    

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="logout-modal">
        <div class="logout-modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to log out?</p>
            <div class="logout-modal-buttons">
                <button id="confirm-logout" class="confirm-logout">Yes, Logout</button>
                <button id="cancel-logout" class="cancel-logout">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Function to handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                // Clear JWT token and user data
                localStorage.removeItem('auth_token');
                localStorage.removeItem('user_data');
                sessionStorage.removeItem('user');
                
                // Attempt to call server-side logout
                fetch('http://localhost/SOURCE_CODE/Employee/public/api/auth.php?action=logout', {
                    method: 'GET'
                }).catch(error => {
                    console.error('Logout API error:', error);
                }).finally(() => {
                    // Redirect to login page
                    const pathname = window.location.pathname.toLowerCase();
                    
                    if (pathname.includes('/pages/')) {
                        // We're in the pages directory
                        window.location.href = 'loginInterface.html';
                    } else {
                        // We're in the root directory
                        window.location.href = 'pages/loginInterface.html';
                    }
                });
            }
        }        // Database API configuration
        const API_BASE_URL = 'http://localhost/SOURCE_CODE/Employee/public/api';
          // Sales data structure
        let currentShiftSales = {
            sales: [],
            totalAmount: 0
        };        // Function to get today's date in local timezone (YYYY-MM-DD format)
        function getTodayLocalDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const localDate = `${year}-${month}-${day}`;
            console.log('📅 Local today date:', localDate, '| Computer time:', now.toString());
            return localDate;
        }// Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // FIXED: Direct logout button event listener
            const logoutBtn = document.getElementById('logout-button');
            if (logoutBtn) {
                // Remove old event listener if it exists
                logoutBtn.removeEventListener('click', handleLogout);
                
                // Add new event listener for showing the modal
                logoutBtn.addEventListener('click', function() {
                    const logoutModal = document.getElementById('logout-modal');
                    if (logoutModal) {
                        logoutModal.style.display = 'flex';
                    }
                });
            }
            
            // Setup modal buttons
            const logoutModal = document.getElementById('logout-modal');
            const confirmLogoutBtn = document.getElementById('confirm-logout');
            const cancelLogoutBtn = document.getElementById('cancel-logout');
            
            // Confirm logout action
            if (confirmLogoutBtn) {
                confirmLogoutBtn.addEventListener('click', function() {
                    if (logoutModal) logoutModal.style.display = 'none';
                    
                    // Use the original logout logic
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_data');
                    sessionStorage.removeItem('user');
                    
                    fetch('http://localhost/SOURCE_CODE/Employee/public/api/auth.php?action=logout', {
                        method: 'GET'
                    }).catch(error => {
                        console.error('Logout API error:', error);
                    }).finally(() => {
                        const pathname = window.location.pathname.toLowerCase();
                        window.location.href = pathname.includes('/pages/') ? 
                            'loginInterface.html' : 'pages/loginInterface.html';
                    });
                });
            }
            
            // Cancel logout
            if (cancelLogoutBtn) {
                cancelLogoutBtn.addEventListener('click', function() {
                    if (logoutModal) logoutModal.style.display = 'none';
                });
            }
            
            // Close when clicking outside
            if (logoutModal) {
                window.addEventListener('click', function(event) {
                    if (event.target === logoutModal) {
                        logoutModal.style.display = 'none';
                    }
                });
            }
            
            // Date picker functionality
            const datePicker = document.getElementById('datePicker');
            if (datePicker) {
                // Set default date to today using local timezone
                const today = getTodayLocalDate();
                datePicker.value = today;
                
                // Load data when date changes
                datePicker.addEventListener('change', function() {
                    loadSalesData(datePicker.value);
                });
            }
            
            // Refresh button functionality
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    refreshBtn.textContent = '🔄 Refreshing...';
                    refreshBtn.disabled = true;
                    const selectedDate = document.getElementById('datePicker').value;
                    loadSalesData(selectedDate).finally(() => {
                        refreshBtn.textContent = '🔄 Refresh';
                        refreshBtn.disabled = false;
                    });
                });
            }
            
            // Load real sales data from database with today's date
            const initialDate = document.getElementById('datePicker').value;
            loadSalesData(initialDate);
        });        // Function to load sales data from database
        async function loadSalesData(selectedDate = null) {
            try {
                showLoading();
                  // Use selected date or default to today
                const targetDate = selectedDate || getTodayLocalDate();
                console.log('🔄 Loading sales data from database for date:', targetDate);
                
                // Update display to show selected date
                updateDateDisplay(targetDate);
                
                // Fetch sales overview for selected date (only completed orders)
                const overviewResponse = await fetch(`${API_BASE_URL}/sales.php?action=overview&status=completed&date=${targetDate}`);
                if (!overviewResponse.ok) {
                    throw new Error(`HTTP error! status: ${overviewResponse.status}`);
                }
                const overviewData = await overviewResponse.json();
                console.log('📊 Overview data:', overviewData);
                  
                // Fetch top selling products for selected date (only completed orders)
                const productsResponse = await fetch(`${API_BASE_URL}/sales.php?action=top_products&limit=20&status=completed&date=${targetDate}`);
                if (!productsResponse.ok) {
                    throw new Error(`HTTP error! status: ${productsResponse.status}`);
                }
                const productsData = await productsResponse.json();
                console.log('🛍️ Products data:', productsData);
                
                // Fetch orders for selected date for order status display
                const ordersResponse = await fetch(`${API_BASE_URL}/orders.php?limit=20&date=${targetDate}`);
                if (!ordersResponse.ok) {
                    throw new Error(`HTTP error! status: ${ordersResponse.status}`);
                }
                const ordersData = await ordersResponse.json();
                console.log('📋 Orders data:', ordersData);
                  if (overviewData.status === 'success' && productsData.status === 'success') {
                    console.log('✅ Sales data loaded successfully');
                    updateSalesDisplay(overviewData.data, productsData.data, targetDate);
                    updateCharts(productsData.data, ordersData.status === 'success' ? ordersData.data : [], targetDate);
                } else {
                    console.error('❌ API Error:', overviewData.message || productsData.message);
                    throw new Error('Failed to fetch sales data: ' + (overviewData.message || productsData.message));
                }
                
            } catch (error) {
                console.error('🚨 Error loading sales data:', error);
                showError('Failed to load sales data. Please check your connection.');
                showFallbackData();
            } finally {
                hideLoading();
            }        }// Function to update sales display with real data
        function updateSalesDisplay(overview, products, selectedDate) {
            const tbody = document.querySelector('.sales-table tbody');
            tbody.innerHTML = '';
            
            // Check if we have products data
            if (!products || products.length === 0) {
                const dateDisplay = selectedDate ? `for ${formatDateDisplay(selectedDate)}` : 'for today';
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 20px; color: #666;">No sales data available ${dateDisplay}</td></tr>`;
                document.getElementById('totalSales').textContent = 'Total: ₱0.00';
                return;
            }
            
            // Display top selling products
            products.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.product_name}</td>
                    <td>${product.total_quantity}</td>
                    <td>₱${Number(product.total_revenue).toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });            
            // Update total sales from overview
            const totalSales = overview.today?.total || overview.today_sales || 0;
            document.getElementById('totalSales').textContent = `Total: ₱${Number(totalSales).toFixed(2)}`;
            
            // Store data for future reference
            currentShiftSales.totalAmount = totalSales;
            currentShiftSales.sales = products.map(product => ({
                product: product.product_name,
                quantity: product.total_quantity,
                total: product.total_revenue
            }));
        }        // Function to update charts with real data
        function updateCharts(products, orders, selectedDate) {
            // Create simple visual representations in chart containers
            const donutChart = document.querySelector('.donut-chart');
            const barGraph = document.querySelector('.bar-graph');
            
            // Clear existing content
            donutChart.innerHTML = '';
            barGraph.innerHTML = '';
              // Determine if it's today or another date for display text
            const today = getTodayLocalDate();
            const isToday = selectedDate === today;
            const dateText = isToday ? 'Today' : formatDateDisplay(selectedDate);
            
            if (products && products.length > 0) {
                // Create donut chart representation
                donutChart.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center;">
                        <h4 style="margin: 0 0 10px 0; color: #67503b;">Top Products</h4>
                        <div style="font-size: 24px; font-weight: bold; color: #67503b;">${products.length}</div>
                        <div style="font-size: 12px; color: #666;">Products Sold ${isToday ? 'Today' : 'on ' + formatDateDisplay(selectedDate)}</div>
                    </div>
                `;
            } else {
                donutChart.innerHTML = `<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: #666;">No data available for ${isToday ? 'today' : formatDateDisplay(selectedDate)}</div>`;
            }
              
            // Create order status display instead of revenue distribution
            if (orders && orders.length > 0) {                
                barGraph.innerHTML = `
                    <div style="display: flex; flex-direction: column; height: 100%; padding: 8px;">
                        <h4 style="margin: 0 0 12px 0; color: #67503b; text-align: center; font-size: 16px;">Orders ${isToday ? 'Today' : 'on ' + formatDateDisplay(selectedDate)}</h4>
                        <div style="flex: 1; overflow-y: auto; max-height: calc(100% - 40px); border: 1px solid #eee; border-radius: 4px; padding: 8px;">
                            ${orders.slice(0, 20).map(order => {
                                const statusColor = order.status === 'completed' ? '#28a745' : 
                                                  order.status === 'pending' ? '#ffc107' : 
                                                  order.status === 'cancelled' ? '#dc3545' : '#6c757d';
                                const statusBadge = order.status === 'completed' ? '✅' : 
                                                   order.status === 'pending' ? '⏳' : 
                                                   order.status === 'cancelled' ? '❌' : '❓';
                                
                                return `
                                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; margin-bottom: 6px; background: #f8f9fa; border-radius: 6px; border-left: 4px solid ${statusColor}; flex-shrink: 0;">
                                        <div style="display: flex; flex-direction: column;">
                                            <span style="font-weight: bold; font-size: 14px; color: #333;">Order #${order.order_number || order.id}</span>
                                            <span style="font-size: 11px; color: #666;">${formatDateDisplay(order.created_at.split(' ')[0])}</span>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 5px;">
                                            <span style="font-size: 14px;">${statusBadge}</span>
                                            <span style="font-size: 12px; font-weight: bold; color: ${statusColor}; text-transform: capitalize;">
                                                ${order.status}
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                barGraph.innerHTML = `<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: #666;">No orders available for ${isToday ? 'today' : formatDateDisplay(selectedDate)}</div>`;
            }
        }

        // Function to show loading state
        function showLoading() {
            const tbody = document.querySelector('.sales-table tbody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 20px; color: #666;">Loading sales data...</td></tr>';
        }

        // Function to hide loading state
        function hideLoading() {
            // Loading state will be replaced by actual data
        }        // Function to show error message
        function showError(message) {
            console.error('💥 Sales History Error:', message);
            const tbody = document.querySelector('.sales-table tbody');
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 20px; color: #e74c3c;">${message}</td></tr>`;
        }        // Function to show fallback data when offline
        function showFallbackData() {
            const tbody = document.querySelector('.sales-table tbody');
            tbody.innerHTML = `
                <tr><td>Offline Mode</td><td>-</td><td>₱0.00</td></tr>
                <tr><td colspan="3" style="text-align: center; padding: 10px; color: #666; font-style: italic;">Connect to database to view real sales data</td></tr>
            `;
            
            document.getElementById('totalSales').textContent = 'Total: ₱0.00 (Offline)';
            
            // Show offline message in charts
            const donutChart = document.querySelector('.donut-chart');
            const barGraph = document.querySelector('.bar-graph');
            donutChart.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: #666;">Offline Mode</div>';
            barGraph.innerHTML = '<div style="display: flex; justify-content: center; align-items: center; height: 100%; color: #666;">Offline Mode - Recent Orders</div>';        }// Function to format date for display
        function formatDateDisplay(dateString) {
            // Parse the date string directly to avoid timezone issues
            const [year, month, day] = dateString.split('-');
            const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
            
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            };
            return date.toLocaleDateString('en-US', options);
        }        // Function to update date display in the table header
        function updateDateDisplay(selectedDate) {
            const tableBox = document.querySelector('.table-box h2');
            if (tableBox) {
                const today = getTodayLocalDate();
                const isToday = selectedDate === today;
                if (isToday) {
                    tableBox.textContent = "Today's Sales";
                } else {
                    tableBox.textContent = `Sales for ${formatDateDisplay(selectedDate)}`;
                }
            }
        }

        // Function to refresh sales data (can be called manually)
        function refreshSalesData() {
            const selectedDate = document.getElementById('datePicker').value;
            loadSalesData(selectedDate);
        }

        // Function to test API connectivity (for debugging)
        async function testApiConnection() {
            try {
                console.log('🔍 Testing API connection...');
                const response = await fetch(`${API_BASE_URL}/sales.php?action=overview`);
                console.log('📡 API Response status:', response.status);
                console.log('📡 API Response ok:', response.ok);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📊 API Response data:', data);
                    return true;
                } else {
                    console.error('❌ API connection failed:', response.status, response.statusText);
                    return false;
                }
            } catch (error) {
                console.error('🚨 API connection error:', error);
                return false;
            }
        }

        // Make test function available globally for debugging
        window.testApiConnection = testApiConnection;
        window.refreshSalesData = refreshSalesData;
    </script>
</body>
</html>
