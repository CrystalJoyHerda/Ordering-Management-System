<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Employees</title>
    <link rel="stylesheet" href="../css/manageEmployee.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">
    <!-- Auth check script -->
    <script src="../js/auth-check.js"></script>
    <!-- Load RBAC service first -->
    <script src="../js/rbac.js"></script>
    <!-- Load logout helper -->
    <script src="../js/logout-helper.js"></script>
    <!-- Load page specific script -->
    <script src="../js/manageEmployee.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">            
            <div class="logo-section">                
                <div class="logo">
                    <img src="../assets/images/logo.png" alt="Coffee Logo">
                </div>
                <div class="admin-text">ADMIN</div>
            </div>              <nav class="sidebar-nav">
                <ul>
                    <li><a href="admindashboard.html">Dashboard</a></li>
                    <li class="active"><a href="manageEmployee.html">Manage Employees</a></li>
                    <li><a href="sales.html">Sales</a></li>
                    <li><a href="inventory.html">Inventory</a></li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <button class="logout-btn">Log Out</button>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Manage Employees</h1>
            </div>
              <div class="controls">
                <div class="search-container">
                    <input type="text" placeholder="Search:" class="search-input" id="searchInput" autocomplete="off">
                </div>
                <button class="add-btn" id="addEmployeeBtn">Add Employee</button>            </div>            <div class="table-container">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th>EMPLOYEE NAME</th>
                            <th>ROLE</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <!-- Table data will be populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="logout-modal">
        <div class="logout-modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to log out?</p>
            <div class="logout-modal-buttons">
                <button id="confirm-logout" class="confirm-logout">Yes, Logout</button>
                <button id="cancel-logout" class="cancel-logout">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Employee Confirmation Modal -->
    <div id="delete-employee-modal" class="logout-modal">
        <div class="logout-modal-content">
            <h3>Delete Employee</h3>
            <p>Are you sure you want to delete this employee? This action cannot be undone.</p>
            <input type="hidden" id="delete-employee-id">
            <div class="logout-modal-buttons">
                <button id="confirm-delete-employee" class="confirm-logout">Yes, Delete</button>
                <button id="cancel-delete-employee" class="cancel-logout">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/rbac.js"></script>
</body>
</html>
