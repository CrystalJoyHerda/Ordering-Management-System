<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History</title>
    <link rel="stylesheet" href="saleshistoryinter.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <img src="../../RESOURCES/logo.png" alt="Coffee Logo">
                </div>
                <div class="cashier-text">CASHIER</div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="cashierdashboard.html">Dashboard</a></li>
                    <li><a href="cashiering.html">Cashiering</a></li>
                    <li><a href="stockscashier.html">Stocks</a></li>
                    <li><a href="saleshistoryinter.html" class="active">Sales History</a></li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1>Sales History</h1>
                <div class="shift-info">
                    <span id="currentShift"></span>
                    <span id="totalSales">Total: ₱0.00</span>
                </div>
            </div>

            <div class="content-grid">
                <!-- Left box with charts -->
                <div class="chart-box">
                    <h2>SALES</h2>
                    <div class="chart-container">
                        <!-- Donut Chart -->
                        <div class="donut-chart">
                            <!-- Chart will be added here -->
                        </div>
                        <!-- Bar Graph -->
                        <div class="bar-graph">
                            <!-- Graph will be added here -->
                        </div>
                    </div>
                </div>

                <!-- Right box with table -->
                <div class="table-box">
                    <table class="sales-table">
                        <thead>
                            <tr>
                                <th>PRODUCT</th>
                                <th>QUANTITY</th>
                                <th>TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Table data will be populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Back button functionality
        document.querySelector('.back-btn').addEventListener('click', () => {
            window.history.back();
        });

        // Logout button functionality
        document.querySelector('.logout-btn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                // Redirect to login page
                window.location.href = 'login.html';
            }
        });

        // Sample sales data structure (replace with your actual data source)
        let currentShiftSales = {
            cashier: 'Ogille Dane Provido',
            shiftStart: '1:00pm',
            shiftEnd: '8:00pm',
            sales: [],
            totalAmount: 0
        };

        // Function to add new sale
        function addSale(orderData) {
            currentShiftSales.sales.push(orderData);
            updateSalesDisplay();
            updateCharts();
        }

        // Function to update sales display
        function updateSalesDisplay() {
            const tbody = document.querySelector('.sales-table tbody');
            tbody.innerHTML = '';
            
            currentShiftSales.sales.forEach(sale => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${sale.product}</td>
                    <td>${sale.quantity}</td>
                    <td>₱${sale.total.toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });

            // Update total sales
            currentShiftSales.totalAmount = currentShiftSales.sales.reduce((sum, sale) => sum + sale.total, 0);
            document.getElementById('totalSales').textContent = `Total: ₱${currentShiftSales.totalAmount.toFixed(2)}`;
        }

        // Function to update charts (implement with your preferred chart library)
        function updateCharts() {
            // Group sales by product for donut chart
            const productTotals = {};
            currentShiftSales.sales.forEach(sale => {
                if (productTotals[sale.product]) {
                    productTotals[sale.product] += sale.total;
                } else {
                    productTotals[sale.product] = sale.total;
                }
            });

            // Update donut chart here

            // Group sales by hour for bar graph
            const hourlyTotals = {};
            currentShiftSales.sales.forEach(sale => {
                const hour = new Date(sale.timestamp).getHours();
                if (hourlyTotals[hour]) {
                    hourlyTotals[hour] += sale.total;
                } else {
                    hourlyTotals[hour] = sale.total;
                }
            });

            // Update bar graph here
        }

        // Display current shift info
        document.getElementById('currentShift').textContent = 
            `Current Shift: ${currentShiftSales.shiftStart} - ${currentShiftSales.shiftEnd}`;

        // Initialize display
        updateSalesDisplay();
        updateCharts();
    </script>
</body>
</html>
