<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POS System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      padding: 5px;
      background-color: white;
    }

    .datetime, .employee {
      background-color: #ecebff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .header-center {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .input-box {
      background-color: #ecebff;
      padding: 8px 12px;
      border-radius: 10px;
      width: 300px;
      text-align: left;
    }

    .order-title {
      background-color: #dcdcdc;
      padding: 10px;
      margin: 20px 0 10px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 12px;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .column-header {
      font-weight: bold;
      background-color: #e0e0e0;
      padding: 10px;
      border-radius: 10px;
    }

    .grid-box {
      min-height: 150px;
      background-color: #d3d3d3;
      border-radius: 10px;
    }

    .total-amount-box {
      background-color: #d3d3d3;
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .action-button {
      padding: 12px 24px;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .cancel-button {
      background-color: red;
    }

    .confirm-button {
      background-color: green;
    }
  </style>
  <script>
    function updateDateTime() {
        const now = new Date();
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12;

        const dateTimeString = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()} ${hours}:${minutes}${ampm}`;
        document.getElementById('datetime').innerHTML = dateTimeString;
    }

    // Update time every second
    setInterval(updateDateTime, 1000);
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="../../RESOURCES/logo.png" alt="Coffee Logo" />
      </div>
      <div class="header-center">
        <div id="datetime" class="datetime"></div>
        <div class="input-box">
            Queue Number: <input type="text" id="queueNumber" readonly>
        </div>
        <div class="input-box">
            Order Number: 
            <input type="text" id="orderNumber" placeholder="Enter Order #">
            <button onclick="lookupOrder()" style="padding: 5px 10px;">Look Up</button>
        </div>
      </div>
      <div class="employee" onclick="window.location.href='employee.html'" style="cursor: pointer;">Employee</div>
    </header>

    <div class="order-title">ORDER</div>

    <div class="order-grid">
      <div class="column-header">Quantity</div>
      <div class="column-header">Product Name</div>
      <div class="column-header">Price</div>

      <div id="items-container" class="grid-box"></div>
      <div id="names-container" class="grid-box"></div>
      <div id="prices-container" class="grid-box"></div>
    </div>

    <div class="total-amount-box" id="total">Total Amount: ₱0.00</div>

    <!-- Add input form for new items -->
    <div class="add-item-form" style="margin-bottom: 20px;">
        <input type="number" id="quantity" placeholder="Quantity" min="1" style="padding: 5px;">
        <input type="text" id="productName" placeholder="Product Name" style="padding: 5px;">
        <input type="number" id="price" placeholder="Price" min="0" step="0.01" style="padding: 5px;">
        <button onclick="handleAddItem()" style="padding: 5px 10px;">Add Item</button>
    </div>

    <script>
        // Sample order data (replace with your actual data source)
        const sampleOrders = {
            '001': [
                { quantity: 2, name: 'Cappuccino', price: 150 },
                { quantity: 1, name: 'Croissant', price: 80 }
            ]
        };

        function lookupOrder() {
            const orderNum = document.getElementById('orderNumber').value;
            const order = sampleOrders[orderNum];
            
            if (!order) {
                alert('Order not found');
                return;
            }

            // Clear existing items
            document.getElementById('items-container').innerHTML = '';
            document.getElementById('names-container').innerHTML = '';
            document.getElementById('prices-container').innerHTML = '';

            // Display order items
            order.forEach(item => {
                addOrderItem(item.quantity, item.name, item.price);
            });
        }

        // Add new function to handle adding items from form
        function handleAddItem() {
            const quantity = document.getElementById('quantity').value;
            const name = document.getElementById('productName').value;
            const price = document.getElementById('price').value;

            if (!quantity || !name || !price) {
                alert('Please fill all fields');
                return;
            }

            addOrderItem(quantity, name, price);

            // Clear form
            document.getElementById('quantity').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('price').value = '';
        }

        // Update existing item div style
        const itemStyle = `
            padding: 8px;
            margin: 5px;
            background-color: #fff;
            border-radius: 5px;
            text-align: left;
        `;

        // Update addOrderItem function
        function addOrderItem(quantity, name, price) {
            const itemsContainer = document.getElementById('items-container');
            const namesContainer = document.getElementById('names-container');
            const pricesContainer = document.getElementById('prices-container');

            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = itemStyle;
            itemDiv.innerHTML = `${quantity} 
                <button onclick="editItem(this)" style="margin-left: 5px;">Edit</button>
                <button onclick="deleteItem(this)" style="margin-left: 5px;">Delete</button>`;
            
            const nameDiv = document.createElement('div');
            nameDiv.style.cssText = itemStyle;
            nameDiv.textContent = name;
            
            const priceDiv = document.createElement('div');
            priceDiv.style.cssText = itemStyle;
            priceDiv.textContent = `₱${parseFloat(price).toFixed(2)}`;

            itemsContainer.appendChild(itemDiv);
            namesContainer.appendChild(nameDiv);
            pricesContainer.appendChild(priceDiv);
            
            updateTotal();
        }

        // Update cancel order functionality
        document.querySelector('.cancel-button').addEventListener('click', function() {
            if(confirm('Are you sure you want to cancel this order?')) {
                // Clear all containers
                document.getElementById('items-container').innerHTML = '';
                document.getElementById('names-container').innerHTML = '';
                document.getElementById('prices-container').innerHTML = '';
                
                // Clear inputs
                document.getElementById('orderNumber').value = '';
                document.getElementById('quantity').value = '';
                document.getElementById('productName').value = '';
                document.getElementById('price').value = '';
                
                // Reset total
                document.getElementById('total').textContent = 'Total Amount: ₱0.00';
            }
        });

        // Add confirm order functionality
        document.querySelector('.confirm-button').addEventListener('click', function() {
            const total = document.getElementById('total').textContent;
            if (total === 'Total Amount: ₱0.00') {
                alert('Please add items to the order first');
                return;
            }
            
            if (confirm('Confirm this order?')) {
                alert('Order confirmed!\n' + total);
                // Reset everything
                document.getElementById('items-container').innerHTML = '';
                document.getElementById('names-container').innerHTML = '';
                document.getElementById('prices-container').innerHTML = '';
                updateTotal();
            }
        });

        // Function to edit item
        function editItem(button) {
            const itemDiv = button.parentElement;
            const index = Array.from(itemDiv.parentElement.children).indexOf(itemDiv);
            const newQuantity = prompt('Enter new quantity:');
            
            if (newQuantity && !isNaN(newQuantity)) {
                itemDiv.innerHTML = `${newQuantity} 
                    <button onclick="editItem(this)" style="margin-left: 5px;">Edit</button>
                    <button onclick="deleteItem(this)" style="margin-left: 5px;">Delete</button>`;
                updateTotal();
            }
        }

        // Function to delete item
        function deleteItem(button) {
            if (confirm('Are you sure you want to remove this item?')) {
                const itemDiv = button.parentElement;
                const index = Array.from(itemDiv.parentElement.children).indexOf(itemDiv);
                
                itemDiv.remove();
                document.getElementById('names-container').children[index].remove();
                document.getElementById('prices-container').children[index].remove();
                
                updateTotal();
            }
        }

        // Function to update total
        function updateTotal() {
            let total = 0;
            const quantities = document.getElementById('items-container').children;
            const prices = document.getElementById('prices-container').children;
            
            for (let i = 0; i < quantities.length; i++) {
                const quantity = parseInt(quantities[i].textContent);
                const price = parseFloat(prices[i].textContent.replace('₱', ''));
                total += quantity * price;
            }
            
            document.getElementById('total').textContent = `Total Amount: ₱${total.toFixed(2)}`;
        }

        // Add functionality to buttons
        document.querySelector('.cancel-button').addEventListener('click', function() {
            if(confirm('Are you sure you want to cancel this order?')) {
                clearOrder();
                alert('Order cancelled');
            }
        });

        document.querySelector('.confirm-button').addEventListener('click', function() {
            if(document.getElementById('total').textContent === 'Total Amount: ₱0.00') {
                alert('Please add items first');
                return;
            }
            if(confirm('Confirm this order?')) {
                // Save order data here
                alert('Order confirmed successfully!');
                clearOrder();
            }
        });

        function clearOrder() {
            document.getElementById('items-container').innerHTML = '';
            document.getElementById('names-container').innerHTML = '';
            document.getElementById('prices-container').innerHTML = '';
            document.getElementById('orderNumber').value = '';
            updateTotal();
        }

        // Make employee text clickable
        document.querySelector('.employee').addEventListener('click', function() {
            window.location.href = 'employee.html';
        });

        // Add functionality to buttons
        document.querySelector('.cancel-button').addEventListener('click', function() {
            if(confirm('Are you sure you want to cancel this order?')) {
                clearOrder();
                window.location.href = 'cashiering.html'; // Refresh page
            }
        });

        document.querySelector('.confirm-button').addEventListener('click', function() {
            const total = document.getElementById('total').textContent;
            if(total === 'Total Amount: ₱0.00') {
                alert('Please add items first');
                return;
            }
            if(confirm('Confirm this order?')) {
                alert('Order confirmed!\n' + total);
                window.location.href = 'orderconfirm.html'; // Go to order confirmation
            }
        });

        // Add queue number generation
        function generateQueueNumber() {
            const today = new Date();
            const number = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            document.getElementById('queueNumber').value = number;
        }

        // Generate queue number when page loads
        window.onload = function() {
            generateQueueNumber();
            updateDateTime();
        }
    </script>
    <div class="button-container">
      <button class="action-button cancel-button">Cancel Order</button>
      <button class="action-button confirm-button">Confirm Order</button>
    </div>
  </div>
</body>
</html>
