<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Stock Management API Test</h1>
    
    <div id="results"></div>
    
    <h2>Test Actions</h2>
    <button onclick="testGetProducts()">1. Test Get Products</button>
    <button onclick="testCreateProduct()">2. Test Create Product with Stock</button>
    <button onclick="testUpdateStock()">3. Test Update Stock</button>
    <button onclick="testGetStockHistory()">4. Test Get Stock History</button>
    <button onclick="runAllTests()">Run All Tests</button>
    
    <script>
        const API_BASE_URL = 'http://localhost/Employee/public/api/products.php';
        let testProductId = null;
        
        function logResult(message, type = 'info', data = null) {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            
            let content = message;
            if (data) {
                content += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            }
            
            div.innerHTML = content;
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...(options.headers || {})
                    },
                    mode: 'cors',
                    credentials: 'include'
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function testGetProducts() {
            logResult('Testing: Get All Products', 'info');
            
            const result = await makeRequest(API_BASE_URL);
            
            if (result.success) {
                logResult('✅ Get Products Success', 'success', result.data);
                
                // Store first product ID for testing
                if (result.data.data && result.data.data.length > 0) {
                    testProductId = result.data.data[0].id;
                    logResult(`📝 Using product ID ${testProductId} for subsequent tests`, 'info');
                }
            } else {
                logResult('❌ Get Products Failed', 'error', result.error || result.data);
            }
        }
        
        async function testCreateProduct() {
            logResult('Testing: Create Product with Stock', 'info');
            
            const productData = {
                name: 'Test Coffee Stock',
                price: 99.99,
                category: 'Hot Coffee',
                status: 'active',
                description: 'Test product for stock management',
                stock_quantity: 50,
                low_stock_threshold: 10
            };
            
            const result = await makeRequest(API_BASE_URL, {
                method: 'POST',
                body: JSON.stringify(productData)
            });
            
            if (result.success) {
                logResult('✅ Create Product with Stock Success', 'success', result.data);
                if (result.data.id) {
                    testProductId = result.data.id;
                    logResult(`📝 Created product with ID ${testProductId}`, 'info');
                }
            } else {
                logResult('❌ Create Product Failed', 'error', result.error || result.data);
            }
        }
        
        async function testUpdateStock() {
            if (!testProductId) {
                logResult('❌ No product ID available for stock update test', 'error');
                return;
            }
            
            logResult(`Testing: Update Stock for Product ID ${testProductId}`, 'info');
            
            const stockData = {
                stock_quantity: 75,
                reason: 'RESTOCK',
                notes: 'Test stock update from API test'
            };
            
            const result = await makeRequest(`${API_BASE_URL}?action=update_stock&id=${testProductId}`, {
                method: 'PUT',
                body: JSON.stringify(stockData)
            });
            
            if (result.success) {
                logResult('✅ Update Stock Success', 'success', result.data);
            } else {
                logResult('❌ Update Stock Failed', 'error', result.error || result.data);
            }
        }
        
        async function testGetStockHistory() {
            if (!testProductId) {
                logResult('❌ No product ID available for stock history test', 'error');
                return;
            }
            
            logResult(`Testing: Get Stock History for Product ID ${testProductId}`, 'info');
            
            const result = await makeRequest(`${API_BASE_URL}?action=stock_history&id=${testProductId}`);
            
            if (result.success) {
                logResult('✅ Get Stock History Success', 'success', result.data);
            } else {
                logResult('❌ Get Stock History Failed', 'error', result.error || result.data);
            }
        }
        
        async function runAllTests() {
            document.getElementById('results').innerHTML = '';
            logResult('🚀 Running All Stock API Tests', 'info');
            
            await testGetProducts();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testCreateProduct();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testUpdateStock();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            await testGetStockHistory();
            
            logResult('🏁 All tests completed', 'info');
        }
        
        // Run initial test on page load
        document.addEventListener('DOMContentLoaded', () => {
            logResult('📋 Stock API Test Tool Ready', 'info');
            logResult('Click "Run All Tests" to test the complete stock management functionality', 'info');
        });
    </script>
</body>
</html>
