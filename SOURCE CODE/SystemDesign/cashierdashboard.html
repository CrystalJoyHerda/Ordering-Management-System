<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard</title>
    <link rel="stylesheet" href="cashierdashboard.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <img src="../../RESOURCES/logo.png" alt="Coffee Logo">
                </div>
                <div class="admin-text">CASHIER</div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="cashierdashboard.html">Dashboard</a></li>
                    <li><a href="cashiering.html">Cashiering</a></li>
                    <li><a href="stocks.html">Stocks</a></li>
                    <li><a href="saleshistoryinter.html">Sales History</a></li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <div class="header">
                <h1>Dashboard</h1>
            </div>
            <div class="content-area">
                <!-- Dashboard content would go here -->
            </div>
        </div>
    </div>

    <script>
        // Logout button functionality
        function handleLogout() {
            if(confirm('Are you sure you want to logout?')) {
                window.location.href = 'login.html';
            }
        }

        // Make sidebar links highlight on click
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
                this.parentElement.classList.add('active');
            });
        });
    </script>
</body>
</html>
