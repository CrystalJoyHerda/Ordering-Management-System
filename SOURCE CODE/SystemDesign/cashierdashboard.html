<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Dashboard</title>
    <link rel="stylesheet" href="cashierdashboard.css">
    <script src="cashierdashboard.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <img src="../../RESOURCES/logo.png" alt="Coffee Logo">
                </div>
                <div class="admin-text">CASHIER</div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="cashierdashboard.html">Dashboard</a></li>
                    <li><a href="cashiering.html">Cashiering</a></li>
                    <li><a href="stockscashier.html">Stocks</a></li>
                    <li><a href="saleshistoryinter.html">Sales History</a></li>
                </ul>
            </nav>
            
            <div class="logout-section">
                <button class="logout-btn" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="main-content">
            <div class="header">
                <h1>Dashboard</h1>
                <div id="datetime" class="datetime"></div>
            </div>
            <div class="content-area">
                <!-- Dashboard Cards -->
                <div class="dashboard-cards">
                    <div class="card">
                        <h3>Today's Sales</h3>
                        <p class="amount">₱0.00</p>
                    </div>
                    <div class="card">
                        <h3>Orders Today</h3>
                        <p class="count">0</p>
                    </div>
                    <div class="card">
                        <h3>Current Queue</h3>
                        <p class="queue-number">0</p>
                    </div>
                    <div class="card">
                        <h3>Low Stock Items</h3>
                        <p class="count">0</p>
                    </div>
                </div>

                <!-- Recent Orders Table -->
                <div class="recent-orders">
                    <h2>Recent Orders</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Time</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Orders will be populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
