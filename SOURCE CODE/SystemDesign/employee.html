<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <button class="back-button">
                <span class="back-arrow">←</span>
                Back
            </button>
            
            <img class="profile-image" src="../../RESOURCES/logo.png" alt="Logo">
            
            <div class="info-container">
                <div class="info-row">
                    <div class="label">Full Name:</div>
                    <div class="value">Ogille Dane Provido</div>
                </div>
                <div class="info-row">
                    <div class="label">Role:</div>
                    <div class="value">Cashier</div>
                </div>
                <div class="info-row">
                    <div class="label">Shift Time:</div>
                    <div class="value">1:00pm-8:00pm</div>
                </div>
                <div class="info-row">
                    <div class="label">Username:</div>
                    <div class="value">ogilledaen1203</div>
                </div>
                <div class="info-row">
                    <div class="label">Email Address:</div>
                    <div class="value">ogilledane@gmail.com</div>
                </div>
            </div>
            
            <button class="logout-button">Log Out</button>
        </div>
    </div>
</body>
</html>
