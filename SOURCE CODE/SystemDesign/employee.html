<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <button class="back-button">
                <span class="back-arrow">←</span>
                Back
            </button>
            
            <img class="profile-image" id="emp-profile" src="../../RESOURCES/default-profile.png" alt="Profile Image">
            
            <div class="info-container" id="employee-info">
                <!-- This section will be populated dynamically based on who's on duty -->
                <div class="info-row">
                    <div class="label">Full Name:</div>
                    <div class="value" id="emp-name"></div>
                </div>
                <div class="info-row">
                    <div class="label">Role:</div>
                    <div class="value" id="emp-role"></div>
                </div>
                <div class="info-row">
                    <div class="label">Shift Time:</div>
                    <div class="value" id="emp-shift"></div>
                </div>
                <div class="info-row">
                    <div class="label">Username:</div>
                    <div class="value" id="emp-username"></div>
                </div>
                <div class="info-row">
                    <div class="label">Email Address:</div>
                    <div class="value" id="emp-email"></div>
                </div>
            </div>
            
            <button class="logout-button">Log Out</button>
        </div>
    </div>

    <script>
        document.querySelector('.back-button').addEventListener('click', function() {
            window.location.href = 'cashiering.html';
        });

        document.querySelector('.logout-button').addEventListener('click', function() {
            if(confirm('Are you sure you want to logout?')) {
                window.location.href = 'login.html';
            }
        });

        // Function to update employee info based on who's on duty
        function updateEmployeeInfo(employeeData) {
            // Update profile image if available
            if (employeeData.profileImage) {
                document.getElementById('emp-profile').src = employeeData.profileImage;
            }
            // Update other employee info
            document.getElementById('emp-name').textContent = employeeData.name;
            document.getElementById('emp-role').textContent = employeeData.role;
            document.getElementById('emp-shift').textContent = employeeData.shift;
            document.getElementById('emp-username').textContent = employeeData.username;
            document.getElementById('emp-email').textContent = employeeData.email;
        }
    </script>
</body>
</html>
