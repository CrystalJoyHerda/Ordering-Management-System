<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Logout Modal</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        /* Modal styles copied from adminDashboard.css */
        .logout-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .logout-modal.show {
            display: flex;
        }

        .logout-modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logout-modal h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .logout-modal p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .logout-modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .logout-modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            min-width: 80px;
        }

        .confirm-logout {
            background-color: #dc3545;
            color: white;
        }

        .cancel-logout {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Logout Modal Test</h1>
    <p>Click the button below to test the logout modal:</p>
    <button class="logout-btn">Test Logout Modal</button>

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" class="logout-modal">
        <div class="logout-modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to log out?</p>
            <div class="logout-modal-buttons">
                <button id="confirm-logout" class="confirm-logout">Yes, Logout</button>
                <button id="cancel-logout" class="cancel-logout">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        console.log('Test page loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            const logoutBtn = document.querySelector('.logout-btn');
            console.log('Logout button found:', logoutBtn);
            
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    console.log('Logout button clicked');
                    e.preventDefault();
                    showLogoutModal();
                });
            }
            
            initializeLogoutModal();
        });
        
        function showLogoutModal() {
            console.log('showLogoutModal called');
            const logoutModal = document.getElementById('logout-modal');
            console.log('Logout modal element:', logoutModal);
            if (logoutModal) {
                logoutModal.classList.add('show');
                console.log('Modal classes after adding show:', logoutModal.classList);
            }
        }
        
        function hideLogoutModal() {
            console.log('hideLogoutModal called');
            const logoutModal = document.getElementById('logout-modal');
            if (logoutModal) {
                logoutModal.classList.remove('show');
            }
        }
        
        function initializeLogoutModal() {
            console.log('Initializing logout modal');
            const logoutModal = document.getElementById('logout-modal');
            const confirmLogoutBtn = document.getElementById('confirm-logout');
            const cancelLogoutBtn = document.getElementById('cancel-logout');
            
            console.log('Modal elements:', { logoutModal, confirmLogoutBtn, cancelLogoutBtn });

            if (!logoutModal || !confirmLogoutBtn || !cancelLogoutBtn) {
                console.error('Logout modal elements not found');
                return;
            }
            
            confirmLogoutBtn.addEventListener('click', function(e) {
                console.log('Confirm logout clicked');
                e.preventDefault();
                hideLogoutModal();
                alert('Logout confirmed (test mode)');
            });
            
            cancelLogoutBtn.addEventListener('click', function(e) {
                console.log('Cancel logout clicked');
                e.preventDefault();
                hideLogoutModal();
            });
            
            logoutModal.addEventListener('click', function(e) {
                if (e.target === logoutModal) {
                    console.log('Modal background clicked');
                    hideLogoutModal();
                }
            });
        }
    </script>
</body>
</html>
