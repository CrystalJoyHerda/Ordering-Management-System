<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="orderconfirm.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="../../RESOURCES/logo.png" alt="Logo">
            </div>
            <div class="header-center">
                <div class="datetime">Tuesday, February 25, 2025 4:33pm</div>
                <div class="queue-input">
                    <label>Queue Number :</label>
                    <input type="text" readonly>
                </div>
            </div>
            <button class="employee-btn">Employee</button>
        </div>

        <div class="content">
            <div class="order-section">
                <h2>ORDER</h2>
                <div class="grid-container">
                    <div class="grid-header">
                        <div>Quantity</div>
                        <div>Product Name</div>
                        <div>Price</div>
                    </div>
                    <div class="grid-content">
                        <!-- Order items will be populated here -->
                    </div>
                </div>
            </div>

            <div class="payment-section">
                <h2>PAYMENT</h2>
                <div class="payment-info">
                    <div class="payment-row total">
                        <span>Total Amount:</span>
                        <span id="totalAmount">₱0.00</span>
                    </div>
                    <div class="payment-row">
                        <span>Cash:</span>
                        <input type="number" id="cashInput" placeholder="₱0.00">
                    </div>
                    <div class="payment-row">
                        <span>Change:</span>
                        <span id="changeAmount">₱0.00</span>
                    </div>
                </div>
                <button class="print-btn" onclick="handlePrint()">Print Receipt</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load order data
            const orderData = JSON.parse(localStorage.getItem('currentOrder'));
            if (!orderData) {
                alert('No order found');
                window.location.href = 'cashiering.html';
                return;
            }

            // Set queue number and datetime
            document.querySelector('.queue-input input').value = orderData.queueNumber;
            document.querySelector('.datetime').textContent = orderData.datetime;

            // Display order items in grid
            const gridContent = document.querySelector('.grid-content');
            gridContent.innerHTML = '';
            
            let total = 0;
            orderData.items.forEach(item => {
                const itemTotal = item.quantity * item.price;
                total += itemTotal;
                
                const row = document.createElement('div');
                row.style.cssText = 'display: grid; grid-template-columns: 1fr 2fr 1fr; padding: 8px;';
                row.innerHTML = `
                    <div>${item.quantity}</div>
                    <div>${item.name}</div>
                    <div>₱${itemTotal.toFixed(2)}</div>
                `;
                gridContent.appendChild(row);
            });

            // Set total amount
            document.getElementById('totalAmount').textContent = `₱${total.toFixed(2)}`;

            // Enable cash input handling
            const cashInput = document.getElementById('cashInput');
            cashInput.addEventListener('input', function() {
                const cash = parseFloat(this.value) || 0;
                const change = cash - total;
                document.getElementById('changeAmount').textContent = 
                    change >= 0 ? `₱${change.toFixed(2)}` : '₱0.00';
            });
        });

        function handlePrint() {
            const cash = document.getElementById('cashInput').value;
            if (!cash) {
                alert('Please enter cash amount');
                return;
            }

            const orderData = JSON.parse(localStorage.getItem('currentOrder'));
            const receiptData = {
                ...orderData,
                cash: cash,
                change: document.getElementById('changeAmount').textContent,
                cashierName: 'Ogille Dane Provido'
            };

            localStorage.setItem('receiptData', JSON.stringify(receiptData));
            window.location.href = 'receiptinter.html';
        }
    </script>
</body>
</html>
