<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Chart Alignment Test</title>
    <style>
        .chart-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
        }

        .chart-placeholder {
            height: 400px;
            position: relative;
            padding: 30px;
            background-color: #faf7f2;
            border-radius: 12px;
            margin: 0 20px;
        }

        .chart-labels {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 30px 50px 20px;
        }

        .x-axis {
            position: absolute;
            bottom: 20px;
            left: 95px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
        }

        .x-axis span {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #666;
            padding: 0 15px;
        }

        .bar-graph {
            position: absolute;
            left: 95px;
            right: 25px;
            top: 25px;
            height: calc(100% - 110px);
            display: flex;
            align-items: flex-end;
            gap: 0;
            padding: 0 15px;
            padding-top: 30px;
        }

        .bar {
            flex: 1;
            margin: 0 15px;
            min-height: 2px;
            background: linear-gradient(to top, #67503b, #a67c52);
            border-radius: 6px 6px 0 0;
            transform-origin: bottom;
            position: relative;
        }        /* Monthly view specific styles */
        .chart-container.monthly-view .chart-placeholder {
            overflow: visible;
        }

        .chart-container.monthly-view .chart-labels {
            min-width: auto;
        }

        .chart-container.monthly-view .x-axis,
        .chart-container.monthly-view .bar-graph {
            min-width: auto;
            left: 95px;
            right: 25px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            padding: 0;
            margin: 0;
        }

        .chart-container.monthly-view .x-axis {
            align-items: center;
        }

        .chart-container.monthly-view .bar-graph {
            align-items: flex-end;
        }

        .chart-container.monthly-view .bar {
            width: 100%;
            max-width: 40px;
            height: auto;
            margin: 0 auto;
            min-width: 20px;
        }

        .chart-container.monthly-view .x-axis span {
            text-align: center;
            font-size: 10px;
            padding: 0;
            margin: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
        }

        .toggle-btn {
            margin: 20px;
            padding: 10px 20px;
            background-color: #67503b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Monthly Chart Alignment Test</h1>
    <button class="toggle-btn" onclick="toggleMonthly()">Toggle Monthly View</button>
    
    <div class="chart-container" id="chartContainer">
        <div class="chart-placeholder">
            <div class="chart-labels">
                <div class="x-axis" id="date-axis">
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>
                </div>
            </div>
            <div class="bar-graph" id="sales-bar-graph">
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 80%"></div>
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 70%"></div>
                <div class="bar" style="height: 90%"></div>
                <div class="bar" style="height: 55%"></div>
                <div class="bar" style="height: 75%"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleMonthly() {
            const container = document.getElementById('chartContainer');
            const barGraph = document.getElementById('sales-bar-graph');
            const xAxis = document.getElementById('date-axis');
            
            if (container.classList.contains('monthly-view')) {
                // Switch to daily view
                container.classList.remove('monthly-view');
                setupDailyView();
            } else {
                // Switch to monthly view
                container.classList.add('monthly-view');
                setupMonthlyView();
            }
        }

        function setupMonthlyView() {
            const barGraph = document.getElementById('sales-bar-graph');
            const xAxis = document.getElementById('date-axis');
            
            // Clear existing content
            barGraph.innerHTML = '';
            xAxis.innerHTML = '';
            
            // Create 12 bars for 12 months
            for (let i = 0; i < 12; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (30 + Math.random() * 60) + '%'; // Random height
                barGraph.appendChild(bar);
            }
              // Create 12 month labels
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            for (let i = 0; i < 12; i++) {
                const label = document.createElement('span');
                label.textContent = months[i];
                xAxis.appendChild(label);
            }
        }

        function setupDailyView() {
            const barGraph = document.getElementById('sales-bar-graph');
            const xAxis = document.getElementById('date-axis');
            
            // Clear existing content
            barGraph.innerHTML = '';
            xAxis.innerHTML = '';
            
            // Create 7 bars for daily view
            for (let i = 0; i < 7; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = (30 + Math.random() * 60) + '%'; // Random height
                barGraph.appendChild(bar);
            }
            
            // Create 7 day labels
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            for (let i = 0; i < 7; i++) {
                const label = document.createElement('span');
                label.textContent = days[i];
                xAxis.appendChild(label);
            }
        }
    </script>
</body>
</html>
